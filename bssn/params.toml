# Experimental constraint damping; zero preserves the original evolution.
# Positive c_H uses reference-metric H_B_ref; see tests/HAMILTONIAN_DAMPING_VALIDATION.md.
c_H = 0.0
Nt = 25000
Nx =  10000
Xmin =-100.0
Xmax = 100.0

NGhost = 3
cfl = 0.10
eta = 2.0
D1 = ["JP6", "ME6"]
D2 = ["JP6", "ME6"]

BHMask = true
BHMaskPos = 0.0
BHMaskWidth = 0.05


#Filter = "JTT8"
#FilterApply = "Vars"
#FilterFrequency = 10
#FilterAlpha = 0.4
#FilterBeta = 0.4


# initial data types = [ "Puncture", "EddingtonFinkelstein" ]
Mass = 1.0
collapsed_lapse = true
initial_data = "Puncture"

# output parameters
output_dir = "output_bssn"
output_interval = 200
print_interval = 20

# --- dissipation filter (interior-only; boundary terms off) ---
[[filters]]
type = "KO6"
apply = "Rhs"
sigma = 0.5
filter_boundary = false
